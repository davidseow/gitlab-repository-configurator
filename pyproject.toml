[project]
name = "gitlab-repository-configurator"
version = "1.0.0"
description = "Single source of truth for configuring GitLab repositories within a group"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["gitlab", "configuration", "repository", "merge-request", "slack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "python-gitlab>=4.2.0",
    "slack-sdk>=3.23.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/yourusername/gitlab-repository-configurator"
Documentation = "https://github.com/yourusername/gitlab-repository-configurator#readme"
Issues = "https://github.com/yourusername/gitlab-repository-configurator/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # PyFlakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "W292",   # blank line at end of file (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # Unused variable in tests OK

[tool.ruff.lint.isort]
known-first-party = ["gitlab_client", "repository_configurator", "config_loader"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests",
]
